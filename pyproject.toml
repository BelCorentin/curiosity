[project]
name = "curio"
version = "0.1.0"
description = "Terminal app for the curiosity daily-riddle game — Textual TUI driving Claude via the Claude Agent SDK"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "claude-agent-sdk>=0.1.0",
]

[project.scripts]
curio = "curio.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curio"]
